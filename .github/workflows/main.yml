name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q Dead.Horizon.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Baixar Three.js para funcionar offline
        working-directory: Dead.Horizon
        run: |
          curl -fL --retry 3 -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js || curl -fL --retry 3 -o app/src/main/assets/three.min.js https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js
          test $(stat -c%s app/src/main/assets/three.min.js) -gt 400000
      - name: Gerar APK
        working-directory: Dead.Horizon
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Dead.Horizon-apk
          path: Dead.Horizon/app/build/outputs/apk/debug/app-debug.apk
